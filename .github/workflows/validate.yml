name: Validate release

on:
  push:
    paths-ignore:
      - 'model/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-and-reconstruction:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q openplant scripts tools tests
      - run: python -m unittest discover -s tests -p test_rebuild.py -v
      - run: python tools/check_release.py
      - run: python scripts/validate_dataset.py --manifest metadata/manifest.csv.gz --classes metadata/classes.csv --summary metadata/summary.json --manifest-only
